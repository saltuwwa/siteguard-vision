[build-system]
requires = ["setuptools>=77,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "siteguard-vision"
version = "0.1.0"
description = "Auditable helmet violation events from video"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "AGPL-3.0-or-later"}
dependencies = [
  "numpy==2.3.3", "opencv-python==4.10.0.84", "pydantic==2.12.5",
  "PyYAML==6.0.3", "typer==0.23.1", "fastapi==0.124.4",
  "uvicorn==0.33.0", "Pillow==11.3.0",
  "scipy==1.17.1", "httpx==0.28.1", "packaging>=25,<27",
]

[project.optional-dependencies]
ml = ["ultralytics>=8.4.0,<8.5.0", "lap>=0.5.12,<0.6", "torch==2.14.1", "torchvision==0.29.1"]
ml-cu128 = ["ultralytics>=8.4.0,<8.5.0", "lap>=0.5.12,<0.6", "torch==2.8.0", "torchvision==0.23.0"]
kafka = ["confluent-kafka>=2.8,<3"]
postgres = ["psycopg[binary]>=3.2,<4"]
dev = ["pytest==9.1.1", "ruff==0.11.13", "mypy==1.15.0", "types-PyYAML==6.0.12.20250402"]
export = ["onnx>=1.17,<2", "onnxruntime>=1.20,<2"]

[project.scripts]
siteguard = "siteguard.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# FD-level capture triggers a native Windows/OpenCV shutdown fault. Python
# capture preserves assertions while leaving native stderr visible.
addopts = "--capture=sys"
markers = ["gpu: genuine GPU/model smoke (opt in)"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
files = ["src/siteguard/config", "src/siteguard/diagnostics.py", "src/siteguard/pipeline.py", "src/siteguard/inference/base.py", "src/siteguard/tracking/association.py", "src/siteguard/rules", "src/siteguard/events/schema.py", "src/siteguard/evaluation/events.py"]
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
follow_imports = "silent"

