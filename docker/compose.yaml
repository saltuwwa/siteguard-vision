services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports: ["127.0.0.1:8000:8000"]
    environment:
      SITEGUARD_DATABASE_URL: sqlite:////app/runs/siteguard.sqlite
      SITEGUARD_API_TOKEN: ${SITEGUARD_API_TOKEN:-}
    volumes: ["../runs:/app/runs"]
    restart: unless-stopped
  kafka:
    image: apache/kafka:3.9.1
    profiles: [kafka]
    ports: ["127.0.0.1:9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes: ["kafka-data:/tmp/kraft-combined-logs"]
  postgres:
    image: postgres:17.4
    profiles: [postgres]
    ports: ["127.0.0.1:5432:5432"]
    environment:
      POSTGRES_DB: siteguard
      POSTGRES_USER: siteguard
      POSTGRES_PASSWORD: ${SITEGUARD_POSTGRES_PASSWORD:-}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
volumes:
  kafka-data:
  postgres-data:
